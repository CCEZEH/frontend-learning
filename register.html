<!DOCTYPE html>
<html lang = "en">

<head>
    <meta charset = "UTF-8">
    <meta name = "viewport" content = "width = device-width, initial-scale = 1.0">

    <title>Create Account - Professional Bank</title>

    <link rel = "stylesheet" href = "style.css">
</head>

<body>
    <header>
        <h1>Professional Bank</h1>
        <nav>
            <a href = "index.html">Home</a>
            <a href = "login.html">Login</a>
            <a href = "register.html">Create Account</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Create Your Bank Account</h2>
            <form>
                <label for = "fullname">Full Name</label>
                <br>
                <input
                    type = "text"
                    id = "fullname"
                    name = "fullname"
                    required>
                <br><br>

                <label for = "email">Email Address</label>
                <br>
                <input
                    type = "emial"
                    id = "email"
                    name = "email"
                    required>
                <br><br>

                <label for = "phone">Phone Number</label>
                <br>
                <input
                    type = "tel"
                    id = "phone"
                    name = "phone"
                    required>
                <br><br>

                <label for = "pin">Create 4-Digit PIN</label>
                <br>
                <input
                    type = "password"
                    id = "pin"
                    name = "pin"
                    maxlength = "4"
                    minlength = "4"
                    required>
                <br><br>

                <label for = "confirm-pin">Confirm PIN</label>
                <br>
                <input
                    type = "password"
                    id = "confirm-pin"
                    name = "confirm-pin"
                    maxlength = "4"
                    minlength = "4"
                    required>
                <br><br>

                <button type = "submit">Create Account</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Professional Bank. All rights reserved.</p>
    </footer>

</body>
</html>
