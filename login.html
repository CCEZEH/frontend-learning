<!DOCTYPE html>

<html lang = "en">
<head>
    <meta charset = "UTF-8">
    <meta name = "viewport" content = "width = device-width, initial-scale = 1.0">
    <title>Professional Bank - Login</title>

    <style>
        :root {
            --primary-color: #174a7e;
            --primary-hover: #123b65;
            --text-color: #1f2933;
            --muted-color: #52606d;
            --background-color: #f4f7fb;
            --card-color: #ffffff;
            --border-color: #d9e2ec;
            --error-color: #b42318;
            --success-color: #18794e;
            --shadow: 0 10px 30px rgba(23, 74, 126, 0.12);
        }
        * {box-sizing: border-box;}

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--background-color);
            color: var(--text-color);
            font-family: Arial, Helvetica, sans-serif;
            line-height: 1.6;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1.5rem;
            padding: 1.25rem 5%;
            background: var(--primary-color);
            color: #ffffff;
        }

        header h1 {
            margin: 0;
            font-size: clam(1.4rem, 3vw, 2rem);
        }

        nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 1rem;
        }

        nav a {
            color: #ffffff;
            font-weight: 600;
            text-decoration: none;
        }

        nav a:hover,
        nav a:focus {text-decoration: underline}

        main {
            width: min(100% - 2rem, 28rem);
            margin: auto;
            padding: 2rem 0;
        }

        main h2 {
            margin: 0 0 1.5rem;
            color: var(--primary-color);
            font-size: clamp(1.5rem, 4vw, 2rem);
            text-align: center;
        }

        form {
            padding: 2rem;
            background: var(--card-color);
            border-radius: 0.75rem;
            box-shadow: var(--shadow)
        }

        label {
            display: block;
            margin-bottom: o.5rem;
            color: var(--text-color);
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: o.75rem 0.875rem;
            border: 1px solid var(--border-color);
            border-radius: 0.375rem;
            color: var(--text-color);
            font: inherit;
        }

        input:focus {
            border-color: var(--primary-color);
            outline: 3px solid rgba(23, 74,126, 0.2);
            outline-offset: 2px;
        }

        input:valid:not(:placeholder-shown){
            border-color: var(--error-color);
            box-shadow: 0 0 0 2px rgba(180, 35,24, 0.15);
        }

        input:valid:not(:placeholder-shown) {
            border-color: var(--success-color);
            box-shadow: 0 0 0 2px rgba(24, 121, 78, 0.15);
        }

        input:focus:invalid,
        input:focus:valid {
            outline: 3px solid rgba(23, 74, 126, 0.2);
        }

        .field-error {
            min-height: 1.6rem;
            margin: 0.25rem 0 1rem;
            color: var(--error-color);
            font-size: 0.9rem;
            font-weight: 600;
        }

        button {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 0;
            border-radius: 0.375rem;
            background: var(--primary-color);
            color: #ffffff;
            cursor: pointer;
            font: inherit;
            font-weight: 700;
        }

        button:hover,
        button:focus {
            background: var(--primary-hover);
        }

        buttton:focus,
        nav a:focus {
            outline: 3px solid #fbbf24;
            outline-offset: 3px;
        }

        .error-message {
            min-height: 1.6rem;
            margin-bottom: 1rem;
            color: var(--error-color);
            font-weight:600;
        }

        footer {
            margin-top: auto;
            padding: 1.25rem;
            color: var(--muted-color);
            text-align: center;
        }

        footer p {margin: 0;}

        @media (max-width: 600px) {
            header {
                align-items: flex-start;
                flex-direction: column;
                padding: 1rem;
            }
            nav {
                justify-content: flex-start;
                gap: 0.75rem 1rem;
            }
            main {
                width: min(100% - 1.5rem, 28rem);
                padding: 1.5rem 0;
            }
            form {
                padding: 1.5rem;
            }}
    </style>

</head>

</body>
